<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubblyBoo</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BubblyBoo">
<meta name="theme-color" content="#5ecbff">
<style>
:root{--ink:#1d2140;--accent:#ff5d73;--accent2:#3aa0ff;--gold:#ffc300;--ok:#22a06b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#8fdcff,#e8f9ff 60%,#fff6dc)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px;flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:900}
.logo{height:52px;width:52px;border-radius:14px;box-shadow:0 4px 10px #0003}
.hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-weight:900;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 3px 0 #0002;border:0;font-family:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
#app{padding:8px 14px 40px;max-width:980px;margin:auto}
button{font-family:inherit;border:0;cursor:pointer;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 5px 0 #0002;font-size:1.05rem;padding:11px 18px;font-weight:700;transition:transform .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #0002}
.btn{background:var(--accent);color:#fff;font-size:1.25rem;padding:14px 24px;font-weight:900}
.panel{background:#ffffffee;border-radius:26px;padding:20px;box-shadow:0 8px 0 #0001}
.title{font-size:1.6rem;font-weight:900;text-align:center;margin:6px 0 12px}
.caption{font-size:1.2rem;font-weight:800;margin:8px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:22px;padding:14px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 6px 0 #0002;font-size:2.6rem;color:var(--ink)}
.card small{font-size:1.05rem;font-weight:800;margin-top:6px}
.locked{filter:grayscale(.8);opacity:.6}
.badge{font-size:.9rem;color:var(--ok);font-weight:900;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.stick{display:flex;flex-wrap:wrap;gap:8px;font-size:2rem;justify-content:center;margin-top:8px}
.panel label{display:block;font-size:1.15rem;margin:12px 0;font-weight:700}
.panel input[type=checkbox]{transform:scale(1.5);margin-right:12px}
.blob{display:inline-block;width:70px;height:70px;border-radius:50%;box-shadow:inset -6px -6px 0 #0002}
.word{font-weight:900}
.dots{font-size:.6em;line-height:1.2}
.letter{font-weight:900}
.pat{font-size:.8em}
/* game screen */
#game{position:fixed;inset:0;display:none;background:#000;z-index:20;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:12px;color:#fff;font-weight:900;font-size:1.25rem;text-shadow:0 2px 4px #0008;display:flex;gap:14px;align-items:center;flex-wrap:wrap;pointer-events:none}
.bar2{width:170px;height:14px;background:#fff6;border-radius:8px;overflow:hidden}
.bar2 div{height:100%;background:var(--gold)}
#backBtn{position:absolute;right:12px;top:12px;z-index:30;padding:8px 14px;font-size:1rem}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0009;padding:14px;z-index:25}
.qcard{background:#fff;border-radius:28px;padding:22px;max-width:640px;width:100%;text-align:center;box-shadow:0 10px 0 #0004;animation:pop .35s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.qask{font-size:1.6rem;font-weight:900;margin-bottom:6px}
.qshow{font-size:3rem;margin:8px 0;min-height:70px}
.qopts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.qb{min-width:120px;min-height:100px;font-size:2.2rem;font-weight:900;padding:10px;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid #d7e6ff;box-shadow:0 5px 0 #0002;color:var(--ink)}
.qb .blob{width:60px;height:60px;box-shadow:none}
.qb .word{font-size:1.1rem}
.qfb{min-height:36px;font-size:1.3rem;font-weight:900;margin-top:10px;color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="logo.png" alt="BubblyBoo"> BubblyBoo</div>
  <div class="hdr">
    <button id="switchBtn" class="pill" data-act="profiles">👤</button>
    <span class="pill" id="starCount">⭐ 0</span>
    <button id="parentBtn" class="pill" title="Grown-ups">🔒</button>
  </div>
</header>
<main id="app"></main>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <button id="backBtn" class="pill" data-act="quitGame">🏠 Home</button>
  <div id="quiz" class="overlay">
    <div class="qcard">
      <div class="qask" id="qAsk"></div>
      <div class="qshow" id="qShow"></div>
      <div class="qopts" id="qOpts"></div>
      <div class="qfb" id="qFb"></div>
    </div>
  </div>
  <div id="result" class="overlay"><div class="qcard" id="resCard"></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const app = $("#app");
const STORE = "bubblyboo.v3";
const STICKERS = ["🦄","🚀","🐥","🐼","🦖","🌟","🚗","🎈","🍭","🧸","🐬","🦋","🌈","🐢","🦊","🐸","🐵","🦕","🍦","🎉","🏆","👏","🐯","🦉"];
const PRAISE = ["Yes! Great job!","Wow, you got it!","Super! Well done!","You are so smart!"];
const TRY = ["Almost! Try again.","Hmm, look again!","Try the other answer."];

let db;
try { db = JSON.parse(localStorage.getItem(STORE)); } catch (e) { db = null; }
if (!db){
  db = { players: [], current: null };
  try {
    const old = JSON.parse(localStorage.getItem("bubblyboo.v2"));
    if (old && old.players) db = old;
  } catch (e) {}
}
db.players.forEach(p => {
  p.stickers = p.stickers || [];
  p.unlocked = p.unlocked || ["colors"];
  p.done = p.done || [];
  p.progress = p.progress || {};
  p.best = p.best || {};
});
function save(){ try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) {} }
function P(){ return db.players.find(p => p.id === db.current); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }
function updateHeader(){
  const p = P();
  $("#starCount").textContent = "⭐ " + (p ? p.stars : 0);
  $("#switchBtn").textContent = "👤 " + (p ? p.name : "Who?");
}

/* ---------- Voice ---------- */
let voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  voice = v.find(x => /en[-_]US/i.test(x.lang) && /female|samantha|google|zira/i.test(x.name))
       || v.find(x => x.lang && x.lang.startsWith("en")) || null;
}
if ("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
function say(text, rate = 0.9){
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate; u.pitch = 1.1;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------- Helpers ---------- */
function rand(n){ return Math.floor(Math.random() * n); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(arr){ return arr[rand(arr.length)]; }
function mk(name, show, o = {}){
  return Object.assign({ name, show, label: show, text: name, say: `This is ${name}!`, ask: `Tap the ${name}.` }, o);
}
const ones = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tens = ["","","twenty","thirty","forty","fifty"];
function numWord(n){ if (n < 20) return ones[n]; const o = n % 10; return tens[Math.floor(n / 10)] + (o ? "-" + ones[o] : ""); }
function dots(n){ return '<div class="dots">' + "⭐".repeat(n) + "</div>"; }

/* ---------- Topics ---------- */
const ALPHA = [
  ["A","apple","🍎","ahh"],["B","ball","⚽","buh","Put your lips together, then pop."],
  ["C","cat","🐱","kuh"],["D","dog","🐶","duh"],["E","egg","🥚","eh"],
  ["F","fish","🐟","fff","Bite your lip and blow."],["G","goat","🐐","guh"],
  ["H","hat","🎩","huh","Breathe out like a little fog."],["I","igloo","🏠","ih"],
  ["J","juice","🧃","juh"],["K","kite","🪁","kuh"],
  ["L","lion","🦁","lll","Touch your tongue to the roof of your mouth."],
  ["M","moon","🌙","mmm","Hum with your lips closed."],["N","nest","🪺","nnn"],
  ["O","octopus","🐙","ohh"],["P","pig","🐷","puh","Pop it out with a little puff of air."],
  ["Q","queen","👑","kwuh"],
  ["R","rabbit","🐰","rrr","Curl your tongue back and buzz. Don't touch the roof of your mouth."],
  ["S","sun","☀️","sss","Hiss like a snake."],
  ["T","tree","🌳","tuh","Tap your tongue behind your teeth."],
  ["U","umbrella","☂️","uh"],["V","van","🚐","vvv","Bite your lip and buzz."],
  ["W","watch","⌚","wuh","Round your lips like the letter O."],["X","box","📦","ks"],
  ["Y","yellow","🟨","yuh"],["Z","zebra","🦓","zzz","Buzz like a bee."]
];
const PATTERNS = [
  ["red","🔴🔵🔴🔵","🔴","Red, blue, red, blue. What comes next? Red!"],
  ["yellow","🟡🟢🟡🟢","🟡","Yellow, green, yellow, green. What comes next? Yellow!"],
  ["dog","🐶🐱🐶🐱","🐶","Dog, cat, dog, cat. What comes next? Dog!"],
  ["star","⭐🌙⭐🌙","⭐","Star, moon, star, moon. What comes next? Star!"],
  ["apple","🍎🍌🍎🍌","🍎","Apple, banana, apple, banana. What comes next? Apple!"],
  ["triangle","🔺🟦🔺🟦","🔺","Triangle, square, triangle, square. What comes next? Triangle!"]
];
const TOPICS = [
  { id:"colors", icon:"🎨", title:"Colors & Shapes", intro:"Let's find colors and shapes!",
    items: [
      ...[["red","#e63946"],["blue","#1d6fd6"],["green","#2a9d4a"],["yellow","#ffd60a"],["orange","#ff8c1a"],
          ["purple","#8e44ad"],["pink","#ff6fb5"],["black","#222"],["brown","#8b5a2b"]]
        .map(([n,c]) => mk(n, `<span class="blob" style="background:${c}"></span>`,
          { say: `Yeah, this is ${n}!`, ask: `Tap the ${n} one.` })),
      mk("circle","⚪",{ say:"Yeah, this is a circle!", ask:"Tap the circle." }),
      mk("square","🟦",{ say:"Yeah, this is a square!", ask:"Tap the square." }),
      mk("triangle","🔺",{ say:"Yeah, this is a triangle!", ask:"Tap the triangle." }),
      mk("star","⭐",{ say:"Yeah, this is a star!", ask:"Tap the star." }),
      mk("heart","❤️",{ say:"Yeah, this is a heart!", ask:"Tap the heart." })
    ]},
  { id:"numbers", icon:"🔢", title:"Numbers 1 to 20", intro:"Let's count to twenty!",
    items: Array.from({length:20}, (_, i) => i + 1).map(n => mk(numWord(n), dots(n), {
      label: String(n), text: numWord(n), say: `${numWord(n)}!`,
      ask: "Count the stars. Which number is it?" }))
  },
  { id:"alphabet", icon:"🔤", title:"Alphabet & Sounds", intro:"Let's learn letter sounds!",
    items: ALPHA.map(([L, w, pic, s, tip]) => mk(L, `<span class="letter">${L}</span>`, {
      label: pic, text: `${L} is for ${w}`,
      say: `${L} says ${s}, as in ${w}!`,
      slow: `${s}... ${s}... ${w}`, tip, ask: `Which picture starts with ${L}?` }))
  },
  { id:"animals", icon:"🐶", title:"Animals", intro:"Let's meet some animals!",
    items: [["dog","🐶"],["cat","🐱"],["cow","🐮"],["pig","🐷"],["horse","🐴"],["chicken","🐔"],
            ["sheep","🐑"],["frog","🐸"],["lion","🦁"],["elephant","🐘"],["duck","🦆"]]
      .map(([n,e]) => mk(n, e, { say: `This is a ${n}!`, ask: `Tap the ${n}.` })) },
  { id:"fruits", icon:"🍎", title:"Fruits & Vegetables", intro:"Let's find yummy fruits and vegetables!",
    items: [["apple","🍎"],["banana","🍌"],["grapes","🍇"],["orange","🍊"],["watermelon","🍉"],
            ["strawberry","🍓"],["carrot","🥕"],["broccoli","🥦"],["tomato","🍅"],["potato","🥔"],["corn","🌽"]]
      .map(([n,e]) => mk(n, e, { say: `This is ${n}!`, ask: `Tap the ${n}.` })) },
  { id:"body", icon:"🖐️", title:"Body Parts", intro:"Let's find our body parts!",
    items: [["nose","👃"],["eyes","👀"],["ears","👂"],["mouth","👄"],["hand","✋"],["foot","🦶"],["teeth","🦷"]]
      .map(([n,e]) => mk(n, e, { say: `Point to your ${n}!`, ask: `Find your ${n}.` })) },
  { id:"days", icon:"📅", title:"Days, Weather & Seasons", intro:"Let's learn days, weather, and seasons!",
    items: [
      ...["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
        .map(d => mk(d, `<span class="word">${d}</span>`, { say: `${d}.`, ask: `Find ${d}.` })),
      mk("sunny","☀️",{ say:"Sunny. The sun is shining!", ask:"Find the sunny one." }),
      mk("rainy","🌧️",{ say:"Rainy. Take an umbrella!", ask:"Find the rainy one." }),
      mk("cloudy","☁️",{ say:"Cloudy. Lots of clouds.", ask:"Find the cloudy one." }),
      mk("snowy","❄️",{ say:"Snowy. Snow is cold and white!", ask:"Find the snowy one." }),
      mk("spring","🌸",{ say:"Spring. Flowers come out!", ask:"Find spring." }),
      mk("summer","🏖️",{ say:"Summer. Time for the beach!", ask:"Find summer." }),
      mk("autumn","🍂",{ say:"Autumn. Leaves fall down!", ask:"Find autumn." }),
      mk("winter","⛄",{ say:"Winter. Brrr, it is cold!", ask:"Find winter." })
    ]},
  { id:"words", icon:"📖", title:"Simple Words", intro:"Let's read some first words!",
    items: ["the","and","I","see","a","is","it","to","you","my","go","big","up","look","can"]
      .map(w => mk(w, `<span class="word">${w}</span>`, { say: `${w}!`, ask: `Find the word ${w}.` })) },
  { id:"patterns", icon:"🧩", title:"Patterns", intro:"Let's find what comes next!",
    items: PATTERNS.map(([n, seq, ans, spoken]) => mk(n, `<span class="pat">${seq} ❓</span>`, {
      label: ans, text: "What comes next?", say: spoken, ask: "What comes next?" })) }
];
function findTopic(id){ return TOPICS.find(t => t.id === id); }

/* ---------- Worlds ---------- */
const WORLDS = [
  ...TOPICS.map(t => ({ id: t.id, icon: t.icon, title: t.title, kind: "topic" })),
  { id: "math", icon: "➕", title: "Math Flight", kind: "math" },
  { id: "spell", icon: "✏️", title: "Spelling Quest", kind: "spell" }
];
const WORLD_BY = id => WORLDS.find(w => w.id === id);
const GOAL_STEP = 12000;
const GATE_GAP = 900;
const SPELL = [["cat","🐱"],["dog","🐶"],["sun","☀️"],["hat","🎩"],["cup","🥤"],["bus","🚌"],["egg","🥚"],["bed","🛏️"],
  ["fish","🐟"],["frog","🐸"],["bird","🐦"],["tree","🌳"],["star","⭐"],["moon","🌙"],["rain","🌧️"],["cake","🎂"],
  ["book","📖"],["duck","🦆"],["apple","🍎"],["lion","🦁"],["horse","🐴"],["train","🚂"],["snow","❄️"],["flower","🌸"]];

/* ---------- Game state ---------- */
const cv = $("#cv"), cx = cv.getContext("2d");
let G = null, rafId = null, lastT = 0;
function groundY(){ return cv.height * 0.84; }

function hideGame(){
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null; G = null;
  $("#game").style.display = "none";
  $("#quiz").style.display = "none";
  $("#result").style.display = "none";
}

/* ---------- Screens ---------- */
function profiles(){
  hideGame();
  app.innerHTML = `
    <section class="panel">
      <div class="title">Who is flying today? 🕷️</div>
      <div class="grid">
        ${db.players.map(p => `<button class="card" data-act="pick" data-id="${p.id}"><div>🧒</div><small>${esc(p.name)}</small></button>`).join("")}
        <button class="card" data-act="add"><div>➕</div><small>Add player</small></button>
      </div>
    </section>`;
}

function home(){
  hideGame();
  const p = P();
  app.innerHTML = `
    <div class="panel">
      <div class="title">Hi ${esc(p.name)}! Pick a world 🌍</div>
      <p class="caption">Webby the spider swings through the city. Answer the gates to keep flying!</p>
      <div class="grid">
        ${WORLDS.map(w => {
          const u = p.unlocked.includes(w.id), d = p.done.includes(w.id);
          return `<button class="card ${u ? "" : "locked"}" data-act="world" data-id="${w.id}">
            <div>${u ? w.icon : "🔒"}</div><small>${w.title}</small>
            <span class="badge">${d ? "✅ Complete" : (u ? "Ready" : "Locked")}</span></button>`;
        }).join("")}
      </div>
      <div class="title" style="margin-top:22px;font-size:1.2rem">My stickers</div>
      <div class="stick">${p.stickers.map(s => `<span>${s}</span>`).join("") || "<i>Fly and answer to earn stickers!</i>"}</div>
    </div>`;
}

function worldCard(id){
  const w = WORLD_BY(id), p = P();
  if (!p.unlocked.includes(id)){ say("Ask a grown-up to open this world."); return; }
  app.innerHTML = `
    <div class="panel" style="text-align:center">
      <div style="font-size:4.5rem">${w.icon}</div>
      <div class="title">${w.title}</div>
      <p class="caption">Tap the screen to release and grab the next web. Answer the gates to keep flying!</p>
      <p class="caption" style="font-size:1rem">Best flight: ${p.best[id] || 0} · ${p.done.includes(id) ? "✅ Complete" : "Not finished yet"}</p>
      <div class="row">
        <button class="btn" data-act="start" data-id="${id}">🕷️ Start flying</button>
        <button data-act="home">⬅ Back</button>
      </div>
    </div>`;
  say(`${w.title}! Tap to swing. Answer the gates to keep flying!`);
}

function parent(){
  const p = P();
  app.innerHTML = `
    <section class="panel">
      <div class="title">Grown-up settings for ${esc(p.name)}</div>
      <p class="caption" style="font-size:1rem">Turn worlds on or off. The next world opens automatically when you finish one.</p>
      ${WORLDS.map(w => `<label><input type="checkbox" data-t="${w.id}" ${p.unlocked.includes(w.id) ? "checked" : ""}> ${w.icon} ${w.title}</label>`).join("")}
      <div class="row" style="margin-top:18px">
        <button data-act="reset">🗑️ Reset this player</button>
        <button data-act="addp">➕ Add player</button>
        <button class="btn" data-act="done">Done</button>
      </div>
    </section>`;
}

/* ---------- Questions ---------- */
function packQ(ask, show, values, correctValue){
  const vals = shuffle(values.slice());
  return { ask, show, labels: vals, correct: vals.indexOf(correctValue) };
}

function makeQuestion(w, lvl){
  const n = lvl >= 2 ? 4 : 3;
  if (w.kind === "math"){
    const max = [10, 20, 50][Math.min(lvl - 1, 2)];
    let ans, ask, show;
    if (Math.random() < 0.5){
      const sum = 2 + rand(max - 1), a = 1 + rand(sum - 1), b = sum - a;
      ans = sum; ask = `What is ${a} plus ${b}?`; show = `${a} + ${b} = ?`;
    } else {
      const a = 2 + rand(max - 1), b = 1 + rand(a - 1);
      ans = a - b; ask = `What is ${a} minus ${b}?`; show = `${a} − ${b} = ?`;
    }
    const vals = new Set([ans]);
    while (vals.size < n){ const d = ans + rand(7) - 3; if (d >= 0) vals.add(d); }
    return packQ(ask, show, [...vals].map(String), String(ans));
  }
  if (w.kind === "spell"){
    const list = SPELL.filter(([word]) => lvl >= 2 || word.length <= 3);
    const [word, emo] = pick(list);
    const pos = rand(word.length), correct = word[pos];
    const shown = [...word].map((c, i) => (i === pos ? "_" : c)).join(" ");
    const show = `<div style="font-size:3.2rem">${emo}</div><div style="letter-spacing:.2em">${shown}</div>`;
    const L = "abcdefghijklmnopqrstuvwxyz", vals = new Set([correct]);
    while (vals.size < n) vals.add(L[rand(26)]);
    return packQ("Which letter is missing?", show, [...vals], correct);
  }
  const items = findTopic(w.id).items;
  const target = pick(items);
  const others = shuffle(items.filter(i => i !== target && i.label !== target.label)).slice(0, n - 1);
  const vals = shuffle([target, ...others]);
  return { ask: target.ask, show: target.show, labels: vals.map(v => v.label), correct: vals.indexOf(target) };
}

/* ---------- Sound ---------- */
let actx = null;
function beep(f = 600, d = 0.12){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

/* ---------- Flight ---------- */
function startGame(id){
  if (rafId) cancelAnimationFrame(rafId);
  cv.width = innerWidth; cv.height = innerHeight;
  const H = cv.height;
  G = { w: WORLD_BY(id), hearts: 3, stars: 0, correct: 0, dist: 0, goal: GOAL_STEP,
        over: false, quizOpen: false, answering: false, tries: 0, q: null,
        gateX: 260 + GATE_GAP, lastAx: 260, inv: 0, bugs: [], anchors: [] };
  G.anchors.push({ x: 260, y: H * 0.3 });
  const h = { x: 0, y: 0, vx: 0, vy: 0, attached: true, ax: 260, ay: H * 0.3, L: 200, th: 0.9, w: 0 };
  h.x = h.ax + h.L * Math.sin(h.th); h.y = h.ay + h.L * Math.cos(h.th);
  G.hero = h;
  ensureAnchors();
  $("#game").style.display = "block";
  $("#quiz").style.display = "none";
  $("#result").style.display = "none";
  lastT = performance.now();
  say("Webby is flying! Tap to let go and swing!");
  rafId = requestAnimationFrame(loop);
}

function ensureAnchors(){
  const H = cv.height;
  let last = G.anchors[G.anchors.length - 1];
  while (last.x < G.hero.x + cv.width * 1.2){
    last = { x: last.x + 280 + rand(160), y: H * (0.12 + Math.random() * 0.26) };
    G.anchors.push(last);
    if (Math.random() < 0.45)
      G.bugs.push({ x: last.x + 140 + rand(120), y0: H * (0.3 + Math.random() * 0.35), ph: Math.random() * 6 });
  }
  G.anchors = G.anchors.filter(a => a.x > G.hero.x - 900);
  G.bugs = G.bugs.filter(b => b.x > G.hero.x - 900);
}

function tryAttach(){
  const h = G.hero;
  let best = null, bd = 1e9;
  for (const a of G.anchors){
    const d = Math.hypot(a.x - h.x, a.y - h.y);
    if (a.x > G.lastAx + 30 && a.x > h.x - 60 && d > 140 && d < 440 && d < bd){ best = a; bd = d; }
  }
  if (!best){ beep(300, 0.08); return; }
  h.attached = true; h.ax = best.x; h.ay = best.y; h.L = bd;
  h.th = Math.atan2(h.x - best.x, h.y - best.y);
  h.w = (h.vx * Math.cos(h.th) - h.vy * Math.sin(h.th)) / h.L;
  G.lastAx = best.x;
  beep(520, 0.1);
}

function release(){
  const h = G.hero;
  h.attached = false;
  h.vx = h.L * h.w * Math.cos(h.th);
  h.vy = -h.L * h.w * Math.sin(h.th);
  if (h.vx < 220) h.vx = 220;
  beep(660, 0.08);
}

function update(dt){
  const h = G.hero, t = performance.now() / 1000;
  if (h.attached){
    h.w += (-(900 / h.L) * Math.sin(h.th)) * dt;
    h.w *= Math.pow(0.995, dt * 60);
    h.th += h.w * dt;
    h.x = h.ax + h.L * Math.sin(h.th);
    h.y = h.ay + h.L * Math.cos(h.th);
  } else {
    h.vy += 900 * dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
  }
  if (h.y > groundY() - 20) return crash();
  if (G.inv > 0) G.inv -= dt;
  else {
    for (const b of G.bugs){
      const by = b.y0 + Math.sin(t * 2 + b.ph) * 40;
      if (Math.abs(b.x - h.x) < 40 && Math.abs(by - h.y) < 40) return hit();
    }
  }
  G.dist = Math.max(0, Math.round(h.x - 260));
  if (!G.quizOpen && h.x >= G.gateX) openQuiz();
  if (!G.goalShown && G.dist >= G.goal) showGoal();
}

function hit(){
  const h = G.hero;
  G.hearts--; G.inv = 1.5; beep(160, 0.3);
  if (!h.attached) h.vy = -260;
  say("Ouch! Be careful, Webby!");
  if (G.hearts <= 0) endGame();
}

function crash(){
  G.hearts--; beep(120, 0.3);
  if (G.hearts <= 0) return endGame();
  const h = G.hero;
  const a = G.anchors.filter(p => p.x > h.x - 100).sort((p, q) => p.x - q.x)[0]
         || { x: h.x + 300, y: cv.height * 0.3 };
  G.lastAx = a.x - 1;
  h.attached = true; h.ax = a.x; h.ay = a.y; h.L = 200; h.th = 0.6; h.w = 0;
  h.x = h.ax + h.L * Math.sin(h.th); h.y = h.ay + h.L * Math.cos(h.th);
  G.inv = 1.5;
  say("Oops! Webby is back up. Keep going!");
}

function level(){ return 1 + Math.floor(G.dist / 3000); }

function openQuiz(){
  G.quizOpen = true; G.answering = false; G.tries = 0;
  G.q = makeQuestion(G.w, level());
  $("#qAsk").textContent = G.q.ask;
  $("#qShow").innerHTML = G.q.show;
  $("#qOpts").innerHTML = G.q.labels.map((l, k) => `<button class="qb" data-act="qa" data-k="${k}">${l}</button>`).join("");
  $("#qFb").textContent = "";
  $("#quiz").style.display = "flex";
  say(G.q.ask);
}

function closeQuiz(){
  G.quizOpen = false; G.answering = false;
  G.gateX += GATE_GAP;
  $("#quiz").style.display = "none";
}

function answerQuiz(k){
  if (!G || !G.quizOpen || G.answering) return;
  if (k === G.q.correct){
    G.answering = true;
    G.correct++; G.stars++;
    const p = P(); p.stars++;
    let extra = "";
    if (p.stars % 5 === 0){
      const s = STICKERS.find(x => !p.stickers.includes(x));
      if (s){ p.stickers.push(s); extra = " You got a new sticker!"; }
    }
    save(); updateHeader(); beep(880, 0.15);
    $("#qFb").textContent = "🎉 Yes! Webby swings on!";
    say(pick(PRAISE) + extra);
    setTimeout(closeQuiz, 1000);
  } else {
    G.tries++; beep(170, 0.2);
    const b = document.querySelectorAll(".qb")[k];
    if (b){ b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 450); }
    if (G.tries >= 2){
      G.answering = true;
      $("#qFb").textContent = "Good try! Webby keeps flying!";
      say("Good try! Let's keep flying.");
      setTimeout(closeQuiz, 1400);
    } else say(pick(TRY));
  }
}

function showResult(html){
  $("#resCard").innerHTML = html;
  $("#result").style.display = "flex";
}

function endGame(){
  G.over = true;
  const p = P();
  p.best[G.w.id] = Math.max(p.best[G.w.id] || 0, G.dist); save();
  showResult(`<div class="title">Good flying, Webby! 🕷️</div>
    <p class="caption">Distance: ${G.dist} · Correct answers: ${G.correct} · ⭐ ${G.stars}</p>
    <div class="row"><button class="btn" data-act="again" data-id="${G.w.id}">🕷️ Fly again</button>
    <button data-act="quitGame">🏠 Home</button></div>`);
  say("Good flying! Let's try again.");
}

function showGoal(){
  G.goalShown = true; G.over = true;
  const p = P();
  const i = WORLDS.findIndex(w => w.id === G.w.id);
  const next = WORLDS[i + 1];
  if (!p.done.includes(G.w.id)) p.done.push(G.w.id);
  if (next && !p.unlocked.includes(next.id)) p.unlocked.push(next.id);
  p.best[G.w.id] = Math.max(p.best[G.w.id] || 0, G.dist);
  save();
  showResult(`<div class="title">🏆 Stage complete!</div>
    <p class="caption">${G.w.title} is finished!${next ? " A new world is open." : ""}</p>
    <div class="row"><button class="btn" data-act="keep">✈️ Keep flying</button>
    <button data-act="quitGame">🏠 Home</button></div>`);
  say("Stage complete! Amazing flying!");
}

function keepFlying(){
  G.goal += GOAL_STEP; G.goalShown = false; G.over = false;
  $("#result").style.display = "none";
  lastT = performance.now();
}

/* ---------- Drawing ---------- */
const BLDG_COLORS = ["#ff9aa2","#9bd4ff","#b5ead7","#ffdac1","#c7b8ff","#a0e7e5"];
function hash(i){ const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function drawCloud(x, y){
  cx.fillStyle = "#ffffffcc";
  cx.beginPath();
  cx.arc(x, y, 26, 0, Math.PI * 2);
  cx.arc(x + 30, y - 12, 32, 0, Math.PI * 2);
  cx.arc(x + 64, y, 26, 0, Math.PI * 2);
  cx.fill();
}

function drawSpider(x, y, t){
  const leg = Math.sin(t * 12) * 6;
  cx.strokeStyle = "#1d2140"; cx.lineWidth = 3;
  for (const s of [-1, 1]){
    for (let j = 0; j < 3; j++){
      const dy = (j - 1) * 6, k = (j % 2 ? 1 : -1) * leg * s;
      cx.beginPath();
      cx.moveTo(x + s * 10, y + dy);
      cx.lineTo(x + s * 34, y + dy * 2.5 + k);
      cx.stroke();
    }
  }
  cx.fillStyle = "#1d2140"; cx.beginPath(); cx.arc(x, y - 10, 10, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = "#e63946"; cx.beginPath(); cx.ellipse(x, y + 8, 17, 20, 0, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = "#ffffff"; cx.beginPath(); cx.arc(x, y + 4, 4, 0, Math.PI * 2); cx.arc(x - 6, y + 14, 3, 0, Math.PI * 2); cx.arc(x + 6, y + 14, 3, 0, Math.PI * 2); cx.fill();
  cx.beginPath(); cx.arc(x - 4, y - 12, 3.5, 0, Math.PI * 2); cx.arc(x + 4, y - 12, 3.5, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = "#1d2140"; cx.beginPath(); cx.arc(x - 4, y - 12, 1.5, 0, Math.PI * 2); cx.arc(x + 4, y - 12, 1.5, 0, Math.PI * 2); cx.fill();
}

function draw(t){
  const W = cv.width, H = cv.height, h = G.hero, cam = h.x - W * 0.3, ground = groundY();
  const sky = cx.createLinearGradient(0, 0, 0, ground);
  sky.addColorStop(0, "#4cc3ff"); sky.addColorStop(1, "#fff1c9");
  cx.fillStyle = sky; cx.fillRect(0, 0, W, H);

  cx.fillStyle = "#fff7a1"; cx.beginPath(); cx.arc(W * 0.85, H * 0.16, 48, 0, Math.PI * 2); cx.fill();

  const c0 = Math.floor(cam * 0.25 / 420) - 1;
  for (let i = c0; i < c0 + Math.ceil(W / 420) + 3; i++)
    drawCloud(i * 420 - cam * 0.25, H * (0.08 + hash(i + 50) * 0.2));

  const b0 = Math.floor(cam * 0.5 / 150) - 1;
  for (let i = b0; i < b0 + Math.ceil(W / 150) + 3; i++){
    const bw = 90 + hash(i) * 70, bh = 160 + hash(i + 7) * 260;
    const x = i * 150 - cam * 0.5, y = ground - bh;
    cx.fillStyle = BLDG_COLORS[Math.abs(i) % BLDG_COLORS.length];
    cx.fillRect(x, y, bw, bh);
    cx.fillStyle = "#ffffffaa";
    for (let wy = y + 14; wy < ground - 24; wy += 26)
      for (let wx = x + 12; wx < x + bw - 18; wx += 22) cx.fillRect(wx, wy, 10, 12);
  }

  cx.fillStyle = "#7bd389"; cx.fillRect(0, ground, W, H - ground);
  cx.fillStyle = "#5fbf72";
  for (let x = -(cam % 40); x < W; x += 40) cx.fillRect(x, ground + 6, 20, 8);

  for (const a of G.anchors){
    const x = a.x - cam;
    if (x < -20 || x > W + 20) continue;
    cx.strokeStyle = "#ffc300"; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(x, a.y, 13, 0, Math.PI * 2); cx.stroke();
    cx.fillStyle = "#ffffff"; cx.beginPath(); cx.arc(x, a.y, 5, 0, Math.PI * 2); cx.fill();
  }

  const gx = G.gateX - cam;
  if (gx > -40 && gx < W + 40){
    cx.fillStyle = "#ffc300"; cx.fillRect(gx - 7, ground - 300, 14, 300);
    cx.font = "48px serif"; cx.textAlign = "center"; cx.fillText("❓", gx, ground - 312);
    cx.textAlign = "start";
  }

  for (const b of G.bugs){
    const x = b.x - cam, y = b.y0 + Math.sin(t * 2 + b.ph) * 40;
    if (x < -60 || x > W + 60) continue;
    cx.font = "44px serif"; cx.textAlign = "center"; cx.fillText("🐞", x, y + 16);
    cx.textAlign = "start";
  }

  if (h.attached){
    cx.strokeStyle = "#ffffffdd"; cx.lineWidth = 2.5;
    cx.beginPath(); cx.moveTo(h.ax - cam, h.ay); cx.lineTo(h.x - cam, h.y); cx.stroke();
  }
  if (!(G.inv > 0 && Math.floor(t * 10) % 2)) drawSpider(h.x - cam, h.y, t);
}

function hudTick(t){
  if (G._hud && t - G._hud < 0.2) return;
  G._hud = t;
  const pct = Math.min(100, Math.round(G.dist / G.goal * 100));
  $("#hud").innerHTML = `<span>${"❤️".repeat(Math.max(0, G.hearts))}</span>
    <span>⭐ ${G.stars}</span>
    <span class="bar2"><div style="width:${pct}%"></div></span>
    <span>🕷️ ${G.dist}</span>`;
}

function loop(t){
  if (!G) return;
  const dt = Math.min(0.033, Math.max(0, (t - lastT) / 1000));
  lastT = t;
  if (!G.over && !G.quizOpen){ update(dt); ensureAnchors(); }
  draw(t / 1000);
  hudTick(t);
  rafId = requestAnimationFrame(loop);
}

/* ---------- Controls ---------- */
function flyTap(){
  if (!G || G.over || G.quizOpen) return;
  if (G.hero.attached) release(); else tryAttach();
}
cv.addEventListener("pointerdown", e => { e.preventDefault(); flyTap(); });
window.addEventListener("keydown", e => {
  if (e.code === "Space" && G){ e.preventDefault(); flyTap(); }
});

/* ---------- Clicks ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a === "home" || a === "quitGame" || a === "done") return home();
  if (a === "profiles") return profiles();
  if (a === "pick"){ db.current = el.dataset.id; save(); updateHeader(); return home(); }
  if (a === "add" || a === "addp"){
    const name = (prompt("Child's first name:") || "").trim();
    if (!name) return;
    const id = "p" + Date.now().toString(36);
    db.players.push({ id, name, stars: 0, stickers: [], unlocked: ["colors"], done: [], progress: {}, best: {} });
    db.current = id; save(); updateHeader();
    return a === "add" ? home() : parent();
  }
  if (a === "world") return worldCard(el.dataset.id);
  if (a === "start" || a === "again") return startGame(el.dataset.id);
  if (a === "qa") return answerQuiz(+el.dataset.k);
  if (a === "keep") return keepFlying();
  if (a === "reset"){
    if (confirm("Erase this player's stars, stickers and finished worlds?")){
      const p = P();
      Object.assign(p, { stars: 0, stickers: [], unlocked: ["colors"], done: [], progress: {}, best: {} });
      save(); updateHeader(); parent();
    }
  }
});

app.addEventListener("change", e => {
  const id = e.target.dataset.t;
  if (!id) return;
  const p = P();
  if (e.target.checked){ if (!p.unlocked.includes(id)) p.unlocked.push(id); }
  else p.unlocked = p.unlocked.filter(x => x !== id);
  save();
});

$("#parentBtn").addEventListener("click", () => {
  const a = prompt("Grown-ups only: what is 7 + 5?");
  if (a === null) return;
  if (a.trim() === "12"){ if (P()) parent(); else profiles(); }
  else alert("Not quite. Try again!");
});

updateHeader();
if (P()) home(); else profiles();

</script>
</body>
