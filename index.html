<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubblyBoo</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BubblyBoo">
<meta name="theme-color" content="#5ecbff">
<style>
:root{--bg:#fff7e6;--ink:#2b2d42;--accent:#ff7b54;--accent2:#4ea8de;--ok:#2a9d6f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px;flex-wrap:wrap}
.logo{height:56px;width:56px;border-radius:14px;vertical-align:middle}
.brand{display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:bold}
.hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#app{padding:8px 12px 40px;max-width:900px;margin:auto}
button{font-family:inherit;border:0;cursor:pointer;border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #0002;font-size:1rem;padding:10px 16px;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
.btn{background:var(--accent);color:#fff;font-size:1.2rem;padding:12px 20px}
.pill{font-weight:bold;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 0 #0002}
.hello{font-size:1.4rem;text-align:center;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.tile{background:#fff;border-radius:22px;min-height:120px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:0 4px 0 #0002;color:var(--ink);text-align:center}
.tile small{font-size:.85rem;margin-top:6px;font-family:inherit}
.tile .word{font-size:1.1rem;font-weight:bold}
.tile .dots{font-size:9px;line-height:1.1}
.tile .letter{font-size:3rem;font-weight:900}
.tile .blob{width:60px;height:60px}
.locked{opacity:.5}
.blob{display:inline-block;width:110px;height:110px;border-radius:50%;box-shadow:inset -8px -8px 0 #0002}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;font-size:4.5rem;background:#fff;border-radius:28px;padding:16px;box-shadow:0 4px 0 #0002;margin:12px 0;text-align:center}
.big .dots{font-size:clamp(14px,4vw,28px);line-height:1.3}
.big .word{font-size:clamp(2.5rem,10vw,5rem);font-weight:bold}
.big .letter{font-size:clamp(7rem,30vw,11rem);font-weight:900;line-height:1}
.big .pat{font-size:clamp(2rem,7vw,3.5rem)}
.big .blob{width:clamp(90px,25vw,160px);height:clamp(90px,25vw,160px)}
.label{font-size:clamp(3rem,10vw,5rem);font-weight:bold}
.caption{font-size:1.6rem;font-weight:bold;margin:8px;text-align:center}
.tip{background:#fff3b0;border-radius:16px;padding:10px 14px;margin:10px 0;font-size:1.1rem;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.bar h2{margin:0;font-size:1.3rem}
.tabs{display:flex;gap:10px;justify-content:center;margin:10px 0}
.tab{padding:10px 18px;font-size:1.1rem}
.tab.on{background:var(--accent2);color:#fff}
.ask{font-size:1.2rem;background:var(--accent2);color:#fff;padding:12px 18px;margin:8px auto;display:block}
.round{text-align:center;font-weight:bold}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:14px 0}
.opt{min-width:130px;min-height:130px;font-size:clamp(2.6rem,9vw,4rem);display:flex;align-items:center;justify-content:center;padding:10px}
.opt .word{font-size:1.4rem;font-weight:bold}
.opt .blob{width:80px;height:80px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ok{font-size:2rem;font-weight:bold;color:var(--ok);text-align:center;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.sticker{font-size:1.2rem;margin-top:6px;text-align:center}
.stick{display:flex;flex-wrap:wrap;gap:8px;font-size:2rem;justify-content:center;min-height:50px;margin-top:8px}
.panel{background:#fff;border-radius:24px;padding:18px;box-shadow:0 4px 0 #0002}
.panel label{display:block;font-size:1.2rem;margin:12px 0}
.panel input[type=checkbox]{transform:scale(1.5);margin-right:12px}
.done{text-align:center}
.field{position:relative;height:60vh;min-height:320px;background:#e9f7ff;border-radius:28px;box-shadow:0 4px 0 #0002;overflow:hidden;margin-top:8px}
.bug{position:absolute;width:80px;height:80px;font-size:3rem;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pop .3s}
.city{position:relative;height:60vh;min-height:340px;border-radius:28px;overflow:hidden;margin-top:8px;box-shadow:0 4px 0 #0002;background:linear-gradient(#bfe9ff,#ffe7b8 70%,#c9b3ff)}
.city::before{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:#8fd3a1}
.bld{position:absolute;bottom:24%;background:#7a8bd6;border-radius:10px 10px 0 0;opacity:.85}
.hero{position:absolute;font-size:3.2rem;transition:left .8s ease,top .8s ease;z-index:1}
.sign{position:absolute;width:118px;min-height:84px;font-size:2.2rem;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:6px;z-index:2;background:#fff;border:4px solid #2b2d42;border-radius:16px;box-shadow:0 4px 0 #0002}
.sign .blob{width:56px;height:56px;box-shadow:none}
.sign.hit{background:#fff3b0;transform:scale(1.1)}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="logo.png" alt="BubblyBoo"> BubblyBoo</div>
  <div class="hdr">
    <button id="switchBtn" class="pill" data-act="profiles">👤</button>
    <span class="pill" id="starCount">⭐ 0</span>
    <button id="parentBtn" title="Grown-ups">🔒</button>
  </div>
</header>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const app = $("#app");
const STORE = "bubblyboo.v2";
const STICKERS = ["🦄","🚀","🐥","🐼","🦖","🌟","🚗","🎈","🍭","🧸","🐬","🦋","🌈","🐢","🦊","🐸","🐵","🦕","🍦","🎉","🏆","👏","🐯","🦉"];
const PRAISE = ["Yes! Great job!","Wow, you got it!","Super! Well done!","You are so smart!"];
const TRY = ["Almost! Try again.","Hmm, look again!","Try the other one."];
const WEB_REQUIRES = ["colors","numbers","alphabet"];

/* ---------- Storage: one profile per child ---------- */
let db;
try { db = JSON.parse(localStorage.getItem(STORE)); } catch (e) { db = null; }
if (!db){
  db = { players: [], current: null };
  try {
    const old = JSON.parse(localStorage.getItem("littleExplorers.v1"));
    if (old){
      db.players.push({ id:"p1", name:"Player 1", stars:old.stars||0, stickers:old.stickers||[], unlocked:old.unlocked||["colors"], done:[] });
      db.current = "p1";
    }
  } catch (e) {}
}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) {} }
db.players.forEach(p => {
  if (!p.progress) p.progress = {};
  if (!p.unlocked.includes("web") && WEB_REQUIRES.every(id => p.done.includes(id))) p.unlocked.push("web");
  if (!p.unlocked.includes("webby") && p.done.includes("web")) p.unlocked.push("webby");
});
function P(){ return db.players.find(p => p.id === db.current); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }
function updateHeader(){
  const p = P();
  $("#starCount").textContent = "⭐ " + (p ? p.stars : 0);
  $("#switchBtn").textContent = "👤 " + (p ? p.name : "Who?");
}

/* ---------- Voice ---------- */
let voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  voice = v.find(x => /en[-_]US/i.test(x.lang) && /female|samantha|google|zira/i.test(x.name))
       || v.find(x => x.lang && x.lang.startsWith("en")) || null;
}
if ("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
function say(text, rate = 0.9){
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate; u.pitch = 1.1;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------- Helpers ---------- */
function rand(n){ return Math.floor(Math.random() * n); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(arr){ return arr[rand(arr.length)]; }
function mk(name, show, o = {}){
  return Object.assign({ name, show, label: show, text: name, say: `This is ${name}!`, ask: `Tap the ${name}.` }, o);
}
const ones = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tens = ["","","twenty","thirty","forty","fifty"];
function numWord(n){ if (n < 20) return ones[n]; const o = n % 10; return tens[Math.floor(n / 10)] + (o ? "-" + ones[o] : ""); }
function dots(n){ return '<div class="dots">' + "⭐".repeat(n) + "</div>"; }

/* ---------- Topics ---------- */
const ALPHA = [
  ["A","apple","🍎","ahh"],["B","ball","⚽","buh","Put your lips together, then pop."],
  ["C","cat","🐱","kuh"],["D","dog","🐶","duh"],["E","egg","🥚","eh"],
  ["F","fish","🐟","fff","Bite your lip and blow."],["G","goat","🐐","guh"],
  ["H","hat","🎩","huh","Breathe out like a little fog."],["I","igloo","🏠","ih"],
  ["J","juice","🧃","juh"],["K","kite","🪁","kuh"],
  ["L","lion","🦁","lll","Touch your tongue to the roof of your mouth."],
  ["M","moon","🌙","mmm","Hum with your lips closed."],["N","nest","🪺","nnn"],
  ["O","octopus","🐙","ohh"],["P","pig","🐷","puh","Pop it out with a little puff of air."],
  ["Q","queen","👑","kwuh"],
  ["R","rabbit","🐰","rrr","Curl your tongue back and buzz. Don't touch the roof of your mouth."],
  ["S","sun","☀️","sss","Hiss like a snake."],
  ["T","tree","🌳","tuh","Tap your tongue behind your teeth."],
  ["U","umbrella","☂️","uh"],["V","van","🚐","vvv","Bite your lip and buzz."],
  ["W","watch","⌚","wuh","Round your lips like the letter O."],["X","box","📦","ks"],
  ["Y","yellow","🟨","yuh"],["Z","zebra","🦓","zzz","Buzz like a bee."]
];
const PATTERNS = [
  ["red","🔴🔵🔴🔵","🔴","Red, blue, red, blue. What comes next? Red!"],
  ["yellow","🟡🟢🟡🟢","🟡","Yellow, green, yellow, green. What comes next? Yellow!"],
  ["dog","🐶🐱🐶🐱","🐶","Dog, cat, dog, cat. What comes next? Dog!"],
  ["star","⭐🌙⭐🌙","⭐","Star, moon, star, moon. What comes next? Star!"],
  ["apple","🍎🍌🍎🍌","🍎","Apple, banana, apple, banana. What comes next? Apple!"],
  ["triangle","🔺🟦🔺🟦","🔺","Triangle, square, triangle, square. What comes next? Triangle!"]
];
const TOPICS = [
  { id:"colors", icon:"🎨", title:"Colors & Shapes", intro:"Let's find colors and shapes!",
    items: [
      ...[["red","#e63946"],["blue","#1d6fd6"],["green","#2a9d4a"],["yellow","#ffd60a"],["orange","#ff8c1a"],
          ["purple","#8e44ad"],["pink","#ff6fb5"],["black","#222"],["brown","#8b5a2b"]]
        .map(([n,c]) => mk(n, `<span class="blob" style="background:${c}"></span>`,
          { say: `Yeah, this is ${n}!`, ask: `Tap the ${n} one.` })),
      mk("circle","⚪",{ say:"Yeah, this is a circle!", ask:"Tap the circle." }),
      mk("square","🟦",{ say:"Yeah, this is a square!", ask:"Tap the square." }),
      mk("triangle","🔺",{ say:"Yeah, this is a triangle!", ask:"Tap the triangle." }),
      mk("star","⭐",{ say:"Yeah, this is a star!", ask:"Tap the star." }),
      mk("heart","❤️",{ say:"Yeah, this is a heart!", ask:"Tap the heart." })
    ]},
  { id:"numbers", icon:"🔢", title:"Numbers 1 to 20", intro:"Let's count to twenty!",
    items: Array.from({length:20}, (_, i) => i + 1).map(n => mk(numWord(n), dots(n), {
      label: String(n), text: numWord(n), say: `${numWord(n)}!`,
      ask: "Count the stars. Which number is it?" }))
  },
  { id:"alphabet", icon:"🔤", title:"Alphabet & Sounds", intro:"Let's learn letter sounds!",
    items: ALPHA.map(([L, w, pic, s, tip]) => mk(L, `<span class="letter">${L}</span>`, {
      label: pic, text: `${L} is for ${w}`,
      say: `${L} says ${s}, as in ${w}!`,
      slow: `${s}... ${s}... ${w}`, tip, ask: `Which picture starts with ${L}?` }))
  },
  { id:"animals", icon:"🐶", title:"Animals", intro:"Let's meet some animals!",
    items: [["dog","🐶"],["cat","🐱"],["cow","🐮"],["pig","🐷"],["horse","🐴"],["chicken","🐔"],
            ["sheep","🐑"],["frog","🐸"],["lion","🦁"],["elephant","🐘"],["duck","🦆"]]
      .map(([n,e]) => mk(n, e, { say: `This is a ${n}!`, ask: `Tap the ${n}.` })) },
  { id:"fruits", icon:"🍎", title:"Fruits & Vegetables", intro:"Let's find yummy fruits and vegetables!",
    items: [["apple","🍎"],["banana","🍌"],["grapes","🍇"],["orange","🍊"],["watermelon","🍉"],
            ["strawberry","🍓"],["carrot","🥕"],["broccoli","🥦"],["tomato","🍅"],["potato","🥔"],["corn","🌽"]]
      .map(([n,e]) => mk(n, e, { say: `This is ${n}!`, ask: `Tap the ${n}.` })) },
  { id:"body", icon:"🖐️", title:"Body Parts", intro:"Let's find our body parts!",
    items: [["nose","👃"],["eyes","👀"],["ears","👂"],["mouth","👄"],["hand","✋"],["foot","🦶"],["teeth","🦷"]]
      .map(([n,e]) => mk(n, e, { say: `Point to your ${n}!`, ask: `Find your ${n}.` })) },
  { id:"days", icon:"📅", title:"Days, Weather & Seasons", intro:"Let's learn days, weather, and seasons!",
    items: [
      ...["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
        .map(d => mk(d, `<span class="word">${d}</span>`, { say: `${d}.`, ask: `Find ${d}.` })),
      mk("sunny","☀️",{ say:"Sunny. The sun is shining!", ask:"Find the sunny one." }),
      mk("rainy","🌧️",{ say:"Rainy. Take an umbrella!", ask:"Find the rainy one." }),
      mk("cloudy","☁️",{ say:"Cloudy. Lots of clouds.", ask:"Find the cloudy one." }),
      mk("snowy","❄️",{ say:"Snowy. Snow is cold and white!", ask:"Find the snowy one." }),
      mk("spring","🌸",{ say:"Spring. Flowers come out!", ask:"Find spring." }),
      mk("summer","🏖️",{ say:"Summer. Time for the beach!", ask:"Find summer." }),
      mk("autumn","🍂",{ say:"Autumn. Leaves fall down!", ask:"Find autumn." }),
      mk("winter","⛄",{ say:"Winter. Brrr, it is cold!", ask:"Find winter." })
    ]},
  { id:"words", icon:"📖", title:"Simple Words", intro:"Let's read some first words!",
    items: ["the","and","I","see","a","is","it","to","you","my","go","big","up","look","can"]
      .map(w => mk(w, `<span class="word">${w}</span>`, { say: `${w}!`, ask: `Find the word ${w}.` })) },
  { id:"patterns", icon:"🧩", title:"Patterns", intro:"Let's find what comes next!",
    items: PATTERNS.map(([n, seq, ans, spoken]) => mk(n, `<span class="pat">${seq} ❓</span>`, {
      label: ans, text: "What comes next?", say: spoken, ask: "What comes next?" })) }
];
function findTopic(id){ return TOPICS.find(t => t.id === id); }
function webUnlocked(){ const p = P(); return WEB_REQUIRES.every(id => p.done.includes(id)); }

/* ---------- Screens ---------- */
let curTopic = null, curItem = null, curTab = "home";
let qRound = 0, qScore = 0, qTarget = null, qOpts = [], busy = false;
let webTimers = [], webLeft = 0, webCaught = 0;

function profiles(){
  curTab = "profiles"; clearWeb();
  app.innerHTML = `
    <section class="panel">
      <h2 style="text-align:center">Who is playing?</h2>
      <div class="grid">
        ${db.players.map(p => `<button class="tile" data-act="pick" data-id="${p.id}"><div>🧒</div><small>${esc(p.name)}</small></button>`).join("")}
        <button class="tile" data-act="add"><div>➕</div><small>Add player</small></button>
      </div>
    </section>`;
}

function home(){
  curTab = "home"; clearWeb();
  const p = P();
  const webOpen = p.unlocked.includes("web");
  app.innerHTML = `
    <p class="hello">Hi ${esc(p.name)}! Pick a topic.</p>
    <div class="grid">
      ${TOPICS.map(t => {
        const u = p.unlocked.includes(t.id), d = p.done.includes(t.id);
        return `<button class="tile ${u ? "" : "locked"}" data-act="topic" data-id="${t.id}">
          <div>${u ? t.icon : "🔒"}</div><small>${d ? "✅ " : ""}${t.title}</small></button>`;
      }).join("")}
      <button class="tile ${webOpen ? "" : "locked"}" data-act="web">
        <div>${webOpen ? "🕸️" : "🔒"}</div><small>${p.done.includes("web") ? "✅ " : ""}Bonus: Web Hero</small></button>
      <button class="tile ${p.unlocked.includes("webby") ? "" : "locked"}" data-act="webby">
        <div>${p.unlocked.includes("webby") ? "🕷️" : "🔒"}</div><small>${p.done.includes("webby") ? "✅ " : ""}Stage 2: Webby</small></button>
    </div>
    <h3 style="text-align:center;margin-top:24px">My stickers</h3>
    <div class="stick">${p.stickers.map(s => `<span>${s}</span>`).join("") || "<i>Play to earn stickers!</i>"}</div>`;
}

function openTopic(id, tab = "learn", fromHome = false){
  curTopic = findTopic(id);
  curTab = tab;
  app.innerHTML = `
    <div class="bar"><button data-act="home">⬅ Home</button><h2>${curTopic.icon} ${curTopic.title}</h2></div>
    <div class="tabs">
      <button class="tab ${tab === "learn" ? "on" : ""}" data-act="tab" data-tab="learn">📖 Learn</button>
      <button class="tab ${tab === "play" ? "on" : ""}" data-act="tab" data-tab="play">🎮 Play</button>
    </div>
    <div id="pane"></div>`;
  if (fromHome) say(curTopic.intro);
  if (tab === "play") startPlay(); else learnGrid();
}

function learnGrid(){
  curTab = "learn";
  $("#pane").innerHTML = `<div class="grid">${curTopic.items.map((it, i) =>
    `<button class="tile" data-act="item" data-i="${i}">${it.show}<small>${it.text}</small></button>`).join("")}</div>`;
}

function showLesson(i){
  curItem = curTopic.items[i];
  const it = curItem;
  $("#pane").innerHTML = `
    <div class="big">${it.show}</div>
    ${it.label !== it.show ? `<div class="label">${it.label}</div>` : ""}
    <div class="caption">${it.text}</div>
    ${it.tip ? `<div class="tip">💡 ${it.tip}</div>` : ""}
    <div class="row">
      <button class="btn" data-act="hear">🔊 Hear again</button>
      ${it.slow ? `<button data-act="slow">🐢 Say it slowly</button>` : ""}
    </div>
    <div class="row"><button data-act="tab" data-tab="learn">⬅ All pictures</button></div>`;
  say(it.say);
}

/* ---------- Play quiz (endless, gets harder with each level) ---------- */
const PROGRESS_PER_LEVEL = 5, STAGE_GOAL = 15;
function topicProgress(){ const p = P(); p.progress = p.progress || {}; return p.progress[curTopic.id] || 0; }
function startPlay(){ playRound(); }

function playRound(){
  if (curTab !== "play") return;
  const items = curTopic.items;
  const progress = topicProgress();
  const level = Math.floor(progress / PROGRESS_PER_LEVEL) + 1;
  const optCount = Math.min(3 + Math.floor((level - 1) / 2), 5);
  qTarget = pick(items);
  const others = shuffle(items.filter(i => i !== qTarget && i.label !== qTarget.label)).slice(0, optCount - 1);
  qOpts = shuffle([qTarget, ...others]);
  busy = false;
  const toNext = PROGRESS_PER_LEVEL - (progress % PROGRESS_PER_LEVEL);
  $("#pane").innerHTML = `
    <div class="round">Level ${level} · ${toNext} more to level up · ⭐ ${P().stars}</div>
    <div class="big">${qTarget.show}</div>
    <button class="ask" data-act="ask">🔊 ${qTarget.ask}</button>
    <div class="opts">${qOpts.map((o, k) => `<button class="opt" data-act="opt" data-k="${k}">${o.label}</button>`).join("")}</div>
    <div id="fb"></div>`;
  say(qTarget.ask);
}

function answer(k){
  if (busy) return;
  const o = qOpts[k];
  if (o !== qTarget){
    say(pick(TRY));
    const b = document.querySelectorAll(".opt")[k];
    b.classList.add("shake");
    setTimeout(() => b.classList.remove("shake"), 500);
    return;
  }
  busy = true;
  const p = P();
  p.progress = p.progress || {};
  const before = p.progress[curTopic.id] || 0;
  const now = before + 1;
  p.progress[curTopic.id] = now;
  p.stars++;
  let extra = "", spoken = pick(PRAISE) + " " + qTarget.name;
  if (p.stars % 5 === 0){
    const s2 = STICKERS.find(x => !p.stickers.includes(x));
    if (s2){ p.stickers.push(s2); extra += `<div class="sticker">New sticker: ${s2}</div>`; }
  }
  if (now % PROGRESS_PER_LEVEL === 0){
    const newLevel = now / PROGRESS_PER_LEVEL + 1;
    extra += `<div class="caption">🎊 Level up! Now level ${newLevel}!</div>`;
    spoken += ` Level up! You are now level ${newLevel}!`;
  }
  if (now === STAGE_GOAL && !p.done.includes(curTopic.id)){
    p.done.push(curTopic.id);
    extra += `<div class="caption">✅ Stage complete! Keep playing for more stars!</div>`;
    spoken += " Stage complete!";
  }
  if (webUnlocked() && !p.unlocked.includes("web")) p.unlocked.push("web");
  save(); updateHeader();
  $("#fb").innerHTML = `<div class="ok">🎉 Yes! ${qTarget.name}!</div>${extra}`;
  say(spoken);
  setTimeout(playRound, 2200);
}

/* ---------- Bonus: Web Hero (endless bug waves) ---------- */
const WEB_WAVES_FOR_STAGE = 3;
let webWave = 0, webGap = 1500, webLife = 2600, waveEnding = false;

function openWeb(){
  if (!P().unlocked.includes("web")){ say("Ask a grown-up to open this game."); return; }
  curTab = "web";
  clearWeb();
  app.innerHTML = `
    <div class="bar"><button data-act="home">⬅ Home</button><h2>🕸️ Web Hero</h2></div>
    <div class="round" id="wtitle"></div>
    <div class="field" id="field"></div>
    <div class="round" id="score"></div>`;
  webCaught = 0;
  say("Web Hero! Tap the bugs before they fly away!");
  startWave(1);
}

function startWave(n){
  if (curTab !== "web") return;
  webWave = n;
  webLeft = 6 + n * 2;
  webGap = Math.max(900, 1500 - n * 120);
  webLife = Math.max(1600, 2600 - n * 150);
  waveEnding = false;
  $("#wtitle").textContent = `Wave ${n} · Tap the bugs before they fly away!`;
  $("#score").textContent = `Bugs caught: ${webCaught}`;
  say(`Wave ${n}!`);
  webTimers.push(setTimeout(nextBug, 1200));
}

function nextBug(){
  if (curTab !== "web" || webLeft <= 0) return;
  const f = $("#field");
  if (!f) return;
  webLeft--;
  const b = document.createElement("button");
  b.className = "bug";
  b.dataset.act = "bug";
  b.textContent = pick(["🐞","🪲","🦗","🪰"]);
  b.style.left = (5 + rand(78)) + "%";
  b.style.top = (5 + rand(72)) + "%";
  f.appendChild(b);
  webTimers.push(setTimeout(() => { b.remove(); checkWebEnd(); }, webLife));
  webTimers.push(setTimeout(nextBug, webGap));
}

function catchBug(b){
  if (!b || b.dataset.gone) return;
  b.dataset.gone = "1";
  webCaught++;
  const p = P(); p.stars++; save(); updateHeader();
  const sc = $("#score"); if (sc) sc.textContent = `Bugs caught: ${webCaught}`;
  b.textContent = "💥";
  say(pick(["Got it!","Pow!","Nice web!"]));
  setTimeout(() => { b.remove(); checkWebEnd(); }, 300);
}

function checkWebEnd(){
  const f = $("#field");
  if (webLeft <= 0 && f && f.children.length === 0) waveDone();
}

function waveDone(){
  if (curTab !== "web" || waveEnding) return;
  waveEnding = true;
  const p = P();
  $("#wtitle").textContent = `Wave ${webWave} complete! Get ready...`;
  say(`Wave ${webWave} complete!`);
  if (webWave >= WEB_WAVES_FOR_STAGE && !p.done.includes("web")){
    p.done.push("web");
    if (!p.unlocked.includes("webby")) p.unlocked.push("webby");
    save();
    $("#wtitle").textContent = "Web Hero complete! Keep going for more bugs!";
    say("Web Hero complete! Stage 2 is open!");
  }
  webTimers.push(setTimeout(() => startWave(webWave + 1), 2500));
}

function clearWeb(){ webTimers.forEach(clearTimeout); webTimers = []; webLeft = 0; clearTimeout(wTimer); }

/* ---------- Stage 2: Webby's City Swing (6 levels, then endless) ---------- */
const WEBBY_SWINGS = 8;
const isNum = it => /^\d+$/.test(it.label);
const WEBBY_LEVELS = [
  { name:"Colors & Shapes", pool:() => findTopic("colors").items,
    face: it => it.show, prompt: it => `Tap the ${it.name}.` },
  { name:"Numbers 1 to 10", pool:() => findTopic("numbers").items.slice(0, 10),
    face: it => it.label, prompt: it => `Tap the number ${it.text}.` },
  { name:"Letters A to J", pool:() => findTopic("alphabet").items.slice(0, 10),
    face: it => it.show, prompt: it => `Find the letter ${it.name}.` },
  { name:"Numbers 11 to 20", pool:() => findTopic("numbers").items.slice(10, 20),
    face: it => it.label, prompt: it => `Tap the number ${it.text}.` },
  { name:"Letters K to T", pool:() => findTopic("alphabet").items.slice(10, 20),
    face: it => it.show, prompt: it => `Find the letter ${it.name}.` },
  { name:"Mixed Challenge",
    pool:() => [...findTopic("colors").items, ...findTopic("numbers").items, ...findTopic("alphabet").items],
    face: it => isNum(it) ? it.label : it.show,
    prompt: it => isNum(it) ? `Tap the number ${it.text}.` : (findTopic("alphabet").items.includes(it) ? `Find the letter ${it.name}.` : `Tap the ${it.name}.`) }
];
const SLOTS = [{l:6,t:30},{l:56,t:20},{l:18,t:62},{l:62,t:58}];
let wLevel = 0, wRound = 0, wTarget = null, wOpts = [], wBusy = false, wHeroPos = {l:4, t:4}, wTimer = null;

function openWebby(){
  if (!P().unlocked.includes("webby")){ say("Ask a grown-up to open this game."); return; }
  curTab = "webby"; clearWeb();
  wLevel = 0; wRound = 0; wHeroPos = {l:4, t:4};
  app.innerHTML = `
    <div class="bar"><button data-act="home">⬅ Home</button><h2>🕷️ Webby's City Swing</h2></div>
    <div class="round" id="wlabel"></div>
    <div class="city" id="city"></div>
    <div class="round" id="wfb"></div>`;
  say("Webby is ready! Tap the right sign to swing!");
  webbyRound();
}

function webbyRound(){
  if (curTab !== "webby") return;
  if (wRound >= WEBBY_SWINGS){
    wRound = 0;
    if (wLevel < WEBBY_LEVELS.length - 1){
      wLevel++;
      say(`Level ${wLevel + 1}! ${WEBBY_LEVELS[wLevel].name}!`);
    } else {
      const p = P();
      if (!p.done.includes("webby")){ p.done.push("webby"); save(); say("Stage 2 complete! Keep swinging for more stars!"); }
      else say("Bonus swing round!");
    }
  }
  const lv = WEBBY_LEVELS[wLevel];
  const pool = lv.pool();
  wTarget = pick(pool);
  const others = shuffle(pool.filter(i => i !== wTarget && i.label !== wTarget.label && i.name !== wTarget.name)).slice(0, 3);
  wOpts = shuffle([wTarget, ...others]);
  const slots = shuffle([...SLOTS]);
  wBusy = false;
  $("#wlabel").textContent = `Level ${wLevel + 1} of ${WEBBY_LEVELS.length} · Swing ${wRound + 1} of ${WEBBY_SWINGS} · ⭐ ${P().stars}`;
  $("#wfb").innerHTML = "";
  $("#city").innerHTML = `
    <div class="bld" style="left:0;width:20%;height:50%"></div>
    <div class="bld" style="left:22%;width:16%;height:66%"></div>
    <div class="bld" style="right:0;width:22%;height:56%"></div>
    <div class="hero" id="hero" style="left:${wHeroPos.l}%;top:${wHeroPos.t}%">🕷️</div>
    ${wOpts.map((o, k) => `<button class="sign" data-act="sign" data-k="${k}" style="left:${slots[k].l}%;top:${slots[k].t}%">${lv.face(o)}</button>`).join("")}`;
  say(lv.prompt(wTarget));
}

function signTap(el){
  if (wBusy) return;
  const o = wOpts[+el.dataset.k];
  if (o === wTarget){
    wBusy = true;
    const p = P(); p.stars++; save(); updateHeader();
    const pos = { l: parseFloat(el.style.left), t: Math.max(0, parseFloat(el.style.top) - 14) };
    wHeroPos = pos;
    const h = $("#hero");
    if (h){ h.style.left = pos.l + "%"; h.style.top = pos.t + "%"; }
    el.classList.add("hit");
    $("#wfb").innerHTML = `<div class="ok">🎉 Yes! ${wTarget.name}!</div>`;
    say(pick(PRAISE) + " " + wTarget.name);
    wRound++;
    wTimer = setTimeout(webbyRound, 1800);
  } else {
    say(pick(TRY));
    el.classList.add("shake");
    setTimeout(() => el.classList.remove("shake"), 500);
  }
}

/* ---------- Parent area ---------- */
function parent(){
  curTab = "parent"; clearWeb();
  const p = P();
  app.innerHTML = `
    <section class="panel">
      <h2>Grown-up settings for ${esc(p.name)}</h2>
      <p>Open topics one at a time. Games open automatically when earned, and you can lock or unlock any of them here.</p>
      ${TOPICS.map(t => `<label><input type="checkbox" data-t="${t.id}" ${p.unlocked.includes(t.id) ? "checked" : ""}> ${t.icon} ${t.title}</label>`).join("")}
      <label><input type="checkbox" data-t="web" ${p.unlocked.includes("web") ? "checked" : ""}> 🕸️ Bonus: Web Hero</label>
      <label><input type="checkbox" data-t="webby" ${p.unlocked.includes("webby") ? "checked" : ""}> 🕷️ Stage 2: Webby</label>
      <div class="row" style="margin-top:18px">
        <button data-act="reset">🗑️ Reset this player</button>
        <button data-act="addp">➕ Add player</button>
        <button class="btn" data-act="done">Done</button>
      </div>
    </section>`;
}

/* ---------- Events ---------- */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a === "home") return home();
  if (a === "profiles") return profiles();
  if (a === "pick"){ db.current = el.dataset.id; save(); updateHeader(); return home(); }
  if (a === "add" || a === "addp"){
    const name = (prompt("Child's first name:") || "").trim();
    if (!name) return;
    const id = "p" + Date.now().toString(36);
    db.players.push({ id, name, stars:0, stickers:[], unlocked:["colors"], done:[], progress:{} });
    db.current = id; save(); updateHeader();
    return a === "add" ? home() : parent();
  }
  if (a === "topic"){
    const t = findTopic(el.dataset.id);
    if (!P().unlocked.includes(t.id)){ say("Ask a grown-up to open this one."); return; }
    return openTopic(t.id, "learn", true);
  }
  if (a === "web") return openWeb();
  if (a === "bug") return catchBug(el);
  if (a === "tab"){
    if (el.dataset.tab === "learn") return openTopic(curTopic.id, "learn");
    return openTopic(curTopic.id, "play");
  }
  if (a === "item") return showLesson(+el.dataset.i);
  if (a === "hear") return say(curItem.say);
  if (a === "slow") return say(curItem.slow, 0.45);
  if (a === "ask") return say(qTarget.ask);
  if (a === "opt") return answer(+el.dataset.k);
  if (a === "play") return openTopic(curTopic.id, "play");
  if (a === "reset"){
    if (confirm("Erase this player's stars, stickers and finished stages?")){
      const p = P();
      Object.assign(p, { stars:0, stickers:[], unlocked:["colors"], done:[], progress:{} });
      save(); updateHeader(); parent();
    }
    return;
  }
  if (a === "webby") return openWebby();
  if (a === "sign") return signTap(el);
  if (a === "done") return home();
});

app.addEventListener("change", e => {
  const id = e.target.dataset.t;
  if (!id) return;
  const p = P();
  if (e.target.checked){ if (!p.unlocked.includes(id)) p.unlocked.push(id); }
  else p.unlocked = p.unlocked.filter(x => x !== id);
  save();
});

$("#parentBtn").addEventListener("click", () => {
  const a = prompt("Grown-ups only: what is 7 + 5?");
  if (a === null) return;
  if (a.trim() === "12"){ if (P()) parent(); else profiles(); }
  else alert("Not quite. Try again!");
});

updateHeader();
if (P()) home(); else profiles();
</script>
</body>
